name: Bug
description: Reproduzierbaren Fehler melden
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Fehlerbild
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Schritte zum Reproduzieren
      placeholder: "1. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Umgebung
      description: Golf-Studio-Version, Windows-Version, Hardware und verwendetes Medienformat – keine privaten Pfade oder Medien hochladen.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Nicht-sensitive Diagnose
  - type: checkboxes
    id: safety
    attributes:
      label: Datenschutz
      options:
        - label: Der Bericht enthält keine Secrets, privaten Medien oder personenbezogenen Dateipfade.
          required: true
